<path d="M849,597 l9,9 l-9,9 l-9,-9 z" fill="#b3261e"/>
<text x="849" y="609.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="866" y="610" font-size="11.5" fill="#5b6470"><tspan font-weight="600" fill="#1a1d21">pilot_valve</tspan>  Air leak at the drain pipes from a pilot valve opening them while the compressor…</text>
<path d="M849,619 l9,9 l-9,9 l-9,-9 z" fill="#b3261e"/>
<text x="849" y="631.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="866" y="632" font-size="11.5" fill="#5b6470"><tspan font-weight="600" fill="#1a1d21">clients</tspan>  Air leak on the pipe feeding the clients. Train had to be moved to the maintenance…</text>
<path d="M849,641 l9,9 l-9,9 l-9,-9 z" fill="#b3261e"/>
<text x="849" y="653.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="866" y="654" font-size="11.5" fill="#5b6470"><tspan font-weight="600" fill="#1a1d21">compressor</tspan>  Oil leak at the compressor. No oil warning reaches the driver, so it ran until the…</text>
<text x="840" y="688" font-size="10.5" fill="#8b949e">All three come from the 2022 sibling dataset. They are what this hardware does,</text>
<text x="840" y="704" font-size="10.5" fill="#8b949e">not events in our window: the four MetroPT-3 reports are all mode 1 or 2.</text>
<text x="62" y="732" font-size="10.5" fill="#8b949e">15 tags, 6 thresholds, 3 failure modes. Source: Data Description_Metro.pdf (UCI zip), primary; flow path from arXiv:2207.05466.</text>
